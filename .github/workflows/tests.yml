name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}
    steps:
      - name: cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: ${{ matrix.python }}
          version: "0.10.0"

      - name: Fix windows .profile
        if: steps.cache.outputs.cache-hit != 'true' && matrix.os == 'windows-latest'
        run: |
          cp ~/.bash_profile ~/.profile

      - name: Install test deps
        env:
          PYPROJECT_DIRECTORY: ${{ inputs.pyproject-directory }}
        run: uv sync --project=${PYPROJECT_DIRECTORY} --locked --group test --no-default-groups

      - name: Install development SLiM
      # This should be COMMENTED OUT for release versions,
      # since this builds SLiM from github head.
        if: (matrix.os == 'macos-latest' || matrix.os == 'ubuntu-24.04') && steps.cache.outputs.cache-hit != 'true'
        # If we want to re-build slim from a new commit to the slim repo
        # we may need to bump the cache key above.
        shell: bash -l {0}
        run: |
          git clone https://github.com/messerlab/SLiM.git
          mkdir -p SLiM/Release
          cd SLiM/Release
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j 2

      - name: run test suite
        shell: bash -l {0}
        run: |
          export PATH=$PWD/SLiM/Release:$PATH
          slim -v
          uv run --project=. --locked --group test --no-default-groups \
          python -m pytest \
            -n 0 \
            -v \
            --cov=stdpopsim \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            tests

      - name: upload coverage report to codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          fail_ci_if_error: true
          env_vars: OS,PYTHON
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          verbose: true
